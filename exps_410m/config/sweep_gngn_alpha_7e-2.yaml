# Full Chinchilla 410M: 4x more steps than 1/4 Chinchilla.
# Skip lr=1e-5, 3e-1, 1e0 via slurm --array=1-8.
# Early stop on divergence (val > 10 = worse than uniform random).
weight_decay: 0.0
beta1: 0.9
optim: scion
scion_norm_steps: 5
scion_momentum: 0.1
matrix_scale: 4.0
embed_tokens_scale: 64.0
lm_head_scale: 4096
oned_params_scale: 8
scion_ngn: global
scion_form: constrained
scion_cap: hm
scion_unconstrained: false
matrix_polyak_mult: 7.0e-2
oned_polyak_mult: 7.0e-2
embed_polyak_mult: 7.0e-2
lm_head_polyak_mult: 7.0e-2
exp_name: gngn_alpha_7e-2
wandb_run_name: gngn_alpha_7e-2
wandb_project: scion_410m_full_chinchilla
steps_budget: 15680
divergence_threshold: 10.0
out_dir: ./exps_410m/experiments
